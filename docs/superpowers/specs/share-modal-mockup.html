<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分享弹窗模板选择 Mockup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  h1 {
    color: #fff;
    text-align: center;
    font-size: 18px;
    margin-bottom: 24px;
    font-weight: 400;
    letter-spacing: 1px;
  }
  .mock-container {
    width: 375px;
    background: #1A1A2E;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }

  /* Modal header */
  .modal-header {
    background: linear-gradient(135deg, #252540 0%, #1A1A2E 100%);
    padding: 20px 24rpx;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1rpx solid rgba(255,255,255,0.08);
  }
  .modal-title {
    color: #F5F0E8;
    font-size: 17px;
    font-weight: 600;
  }
  .modal-close {
    width: 28px;
    height: 28px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #888;
    font-size: 14px;
  }

  /* Modal body */
  .modal-body {
    padding: 16px;
    max-height: 600px;
    overflow-y: auto;
  }

  /* Section label */
  .section-label {
    color: #5C5C72;
    font-size: 13px;
    margin-bottom: 8px;
    display: block;
  }

  /* Template selector */
  .template-selector {
    margin-bottom: 16px;
  }
  .template-options {
    display: flex;
    gap: 12px;
  }
  .template-card {
    flex: 1;
    border-radius: 12px;
    padding: 12px;
    border: 2rpx solid transparent;
    transition: all 0.2s;
    cursor: pointer;
  }
  .template-card.selected {
    border-color: #C9A96E;
    box-shadow: 0 4px 16px rgba(201,169,110,0.2);
  }
  .template-card.business {
    background: linear-gradient(180deg, #F5F6F8 0%, #EBECF0 100%);
  }
  .template-card.friend {
    background: linear-gradient(180deg, #F0F8FF 0%, #E3F0FA 100%);
  }
  .template-preview {
    height: 60px;
    border-radius: 8px;
    margin-bottom: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .template-card.business .template-preview {
    background: linear-gradient(135deg, #1C2433 0%, #2a3244 100%);
  }
  .template-card.friend .template-preview {
    background: linear-gradient(135deg, #4A90D9 0%, #5BA0E8 100%);
  }
  .template-emoji {
    font-size: 16px;
    margin-bottom: 4px;
  }
  .template-card.business .template-emoji { color: #C9A96E; }
  .template-card.friend .template-emoji { color: #fff; }
  .template-name {
    font-size: 12px;
    font-weight: 600;
  }
  .template-card.business .template-name { color: #1C2433; }
  .template-card.friend .template-name { color: #4A90D9; }
  .template-desc {
    font-size: 10px;
    color: #888;
    margin-top: 2px;
  }
  .template-card.friend .template-desc { color: #7BAFD4; }

  /* Checkmark for selected */
  .template-check {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 16px;
    height: 16px;
    background: #C9A96E;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #1A1A2E;
  }
  .template-card { position: relative; }

  /* Divider */
  .divider {
    height: 1rpx;
    background: rgba(255,255,255,0.08);
    margin: 16px 0;
  }

  /* Share title section */
  .share-title-section { margin-bottom: 16px; }
  .share-title-input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1rpx solid rgba(255,255,255,0.10);
    border-radius: 12px;
    padding: 12px;
    color: #F5F0E8;
    font-size: 14px;
    box-sizing: border-box;
    min-height: 50px;
  }

  /* Preview card */
  .preview-card {
    background: rgba(255,255,255,0.04);
    border-radius: 12px;
    padding: 14px;
    border: 1rpx solid rgba(255,255,255,0.08);
    margin-bottom: 12px;
  }
  .preview-label {
    color: #5C5C72;
    font-size: 11px;
    margin-bottom: 10px;
  }
  .preview-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
  }
  .preview-key {
    color: #5C5C72;
    font-size: 12px;
  }
  .preview-value {
    color: #F5F0E8;
    font-size: 12px;
    font-weight: 500;
  }

  /* Share remark section */
  .share-remark-section { margin-top: 12px; }
  .share-remark-label {
    color: #5C5C72;
    font-size: 11px;
    margin-bottom: 6px;
    display: block;
  }
  .share-remark-input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1rpx solid rgba(255,255,255,0.10);
    border-radius: 10px;
    padding: 10px;
    color: #F5F0E8;
    font-size: 12px;
    box-sizing: border-box;
    min-height: 44px;
  }

  /* Address section */
  .address-section { margin-top: 12px; }
  .address-input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1rpx solid rgba(255,255,255,0.10);
    border-radius: 10px;
    padding: 0 12px;
    color: #F5F0E8;
    font-size: 12px;
    box-sizing: border-box;
    height: 40px;
    line-height: 40px;
  }

  /* Buttons */
  .btn-share {
    width: 100%;
    background: #C9A96E;
    color: #0F0F1A;
    border-radius: 14px;
    padding: 16px 0;
    font-size: 15px;
    font-weight: 700;
    text-align: center;
    margin-top: 16px;
    border: none;
  }
  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 10px;
  }
  .btn-save {
    flex: 1;
    background: #252540;
    border: 1rpx solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 12px 0;
    text-align: center;
    color: #F5F0E8;
    font-size: 13px;
  }
  .btn-cancel {
    flex: 1;
    background: transparent;
    border: 1rpx solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 12px 0;
    text-align: center;
    color: #5C5C72;
    font-size: 13px;
  }
</style>
</head>
<body>

<h1>分享弹窗 · 模板选择 Mockup</h1>

<div class="mock-container">
  <!-- Modal header -->
  <view class="modal-header">
    <text class="modal-title">分享给客人</text>
    <view class="modal-close">✕</view>
  </view>

  <view class="modal-body">
    <!-- Template selector -->
    <view class="template-selector">
      <text class="section-label">选择风格</text>
      <view class="template-options">
        <!-- Business selected -->
        <view class="template-card business selected">
          <view class="template-check">✓</view>
          <view class="template-preview">
            <text class="template-emoji">🏛️</text>
            <text class="template-name">商务风格</text>
          </view>
          <text class="template-desc">高端正式</text>
        </view>
        <!-- Friend -->
        <view class="template-card friend">
          <view class="template-preview">
            <text class="template-emoji">🍻</text>
            <text class="template-name">友情风格</text>
          </view>
          <text class="template-desc">温馨亲切</text>
        </view>
      </view>
    </view>

    <view class="divider"></view>

    <!-- Share title -->
    <view class="share-title-section">
      <text class="section-label">分享标题</text>
      <textarea class="share-title-input" placeholder="张三 · 预定信息">张三 · 预定信息</textarea>
    </view>

    <!-- Preview card -->
    <view class="preview-card">
      <text class="preview-label">📋 客人将看到的内容</text>
      <view class="preview-row">
        <text class="preview-key">日期</text>
        <text class="preview-value">5月15日 周四</text>
      </view>
      <view class="preview-row">
        <text class="preview-key">时段</text>
        <text class="preview-value">晚间 18:00</text>
      </view>
      <view class="preview-row">
        <text class="preview-key">包厢</text>
        <text class="preview-value">VIP包厢</text>
      </view>
      <view class="preview-row">
        <text class="preview-key">人数</text>
        <text class="preview-value">8人</text>
      </view>
    </view>

    <!-- Share remark -->
    <view class="share-remark-section">
      <text class="share-remark-label">📝 分享备注（客人可见）</text>
      <textarea class="share-remark-input" placeholder="输入给客人的特殊备注，如停车指引、到店须知等"></textarea>
    </view>

    <!-- Address -->
    <view class="address-section">
      <text class="share-remark-label">📍 地址（可改）</text>
      <input class="address-input" value="北京市朝阳区建国路88号" />
    </view>

    <!-- Buttons -->
    <view class="btn-share">分享到微信</view>
    <view class="btn-row">
      <view class="btn-save">保存</view>
      <view class="btn-cancel">取消</view>
    </view>
  </view>
</div>

</body>
</html>
