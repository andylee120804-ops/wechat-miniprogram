<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=430, initial-scale=1">
<title>方案对比</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; gap: 40px; padding: 40px;
    background: #f0ebe0; font-family: -apple-system, sans-serif;
    justify-content: center;
  }

  .phone {
    width: 390px;
    background: #F8F4ED;
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.05);
    position: relative;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    padding: 14px 28px 0;
    font-size: 12px;
    font-weight: 600;
    color: #2D2D3A;
    position: relative;
    z-index: 2;
  }
  .status-bar .time { font-weight: 700; }
  .status-bar .icons { display: flex; gap: 6px; align-items: center; }

  /* Label */
  .label {
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: #8A8070;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }

  /* ≡≡≡ 方案一：当前（自定义导航） ≡≡≡ */
  .scheme1 .content-wrap {
    position: relative;
  }
  .scheme1 .close-btn {
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.85);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    margin-left: 12px;
    font-size: 16px; color: #8A8070;
    cursor: default;
  }
  .scheme1 .top-band {
    height: 4px;
    background: linear-gradient(90deg, transparent, #C9A96E, transparent);
    margin: 16px 24px 0;
    opacity: 0.5;
  }

  /* Card */
  .card {
    margin: 16px 24px 0;
    background: #FFF;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  .venue-header {
    background: linear-gradient(135deg, #2D2D3A, #1A1A2E);
    padding: 28px 24px 20px;
    text-align: center;
  }
  .venue-header .icon { font-size: 28px; }
  .venue-header .name {
    font-size: 20px; font-weight: 700; color: #F5F0E8;
    letter-spacing: 3px; margin-top: 8px;
  }
  .venue-header .divider {
    width: 24px; height: 3px;
    background: #C9A96E; border-radius: 2px;
    margin: 12px auto 0;
  }
  .title-banner {
    padding: 20px 24px 16px;
    text-align: center; font-size: 20px;
    font-weight: 700; color: #C9A96E;
    letter-spacing: 2px;
  }
  .detail-list { padding: 8px 24px 20px; }
  .detail-item {
    display: flex; justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #F5F2EC;
    font-size: 14px;
  }
  .detail-item .label { color: #B0A89A; }
  .detail-item .value { color: #2D2D3A; font-weight: 500; }

  .address-card {
    margin: 12px 24px 0;
    background: #FFF;
    border-radius: 16px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  .address-card .pin { font-size: 20px; }
  .address-card .info { flex: 1; }
  .address-card .label2 { font-size: 12px; color: #B0A89A; }
  .address-card .addr { font-size: 14px; color: #2D2D3A; }
  .address-card .action {
    background: #F5F2EC; border-radius: 8px;
    padding: 6px 14px; font-size: 12px;
    color: #C9A96E; font-weight: 600;
  }

  .footer {
    text-align: center; margin: 32px 24px 24px;
    font-size: 12px; color: #CCC5B5;
  }
  .footer .line {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,169,110,0.3), transparent);
    margin-bottom: 12px;
  }

  /* ≡≡≡ 方案二：原生导航 ≡≡≡ */
  .scheme2 .native-nav {
    height: 56px;
    background: #2D2D3A;
    display: flex;
    align-items: center;
    padding: 0 16px;
    position: relative;
  }
  .scheme2 .native-nav .back {
    font-size: 22px; color: #F5F0E8;
    cursor: default;
    width: 30px;
  }
  .scheme2 .native-nav .title {
    flex: 1; text-align: center;
    font-size: 17px; font-weight: 600;
    color: #F5F0E8;
  }
  /* 透明导航版本 */
  .scheme2b .native-nav {
    background: transparent;
    position: absolute;
    top: 44px; left: 0; right: 0;
    z-index: 10;
  }
  .scheme2b .native-nav .back { color: #8A8070; }
  .scheme2b .native-nav .title { color: #2D2D3A; }
  .scheme2b .card { margin-top: 0; }
  .scheme2b .content-wrap { padding-top: 100px; }

  .scheme2 .content-wrap, .scheme2b .content-wrap {
    padding: 16px 0 24px;
  }
</style>
</head>
<body>

<!-- 方案一：当前实现 -->
<div>
  <div class="label">▼ 方案一 · 自定义导航（当前）</div>
  <div class="phone scheme1">
    <div class="status-bar">
      <span class="time">9:41</span>
      <span class="icons">📶 🔋</span>
    </div>
    <div class="content-wrap" style="padding-top: 8px;">
      <div style="display:flex; align-items:center; padding-left:12px;">
        <div class="close-btn">✕</div>
      </div>
      <div class="top-band"></div>
      <div class="card">
        <div class="venue-header">
          <div class="icon">❤️</div>
          <div class="name">听澜轩</div>
          <div class="divider"></div>
        </div>
        <div class="title-banner">张先生 · 预定信息</div>
        <div class="detail-list">
          <div class="detail-item"><span class="label">📅 日期</span><span class="value">2026-05-07</span></div>
          <div class="detail-item"><span class="label">🕐 时段</span><span class="value">18:00-21:00</span></div>
          <div class="detail-item"><span class="label">🚪 包厢</span><span class="value">晚市包场</span></div>
          <div class="detail-item"><span class="label">👥 人数</span><span class="value">8人</span></div>
        </div>
      </div>
      <div class="address-card">
        <span class="pin">📍</span>
        <div class="info">
          <div class="label2">食堂地址</div>
          <div class="addr">杭州市西湖区...</div>
        </div>
        <span class="action">导航</span>
      </div>
      <div class="footer"><div class="line"></div>本信息由 听澜轩 提供</div>
    </div>
  </div>
</div>

<!-- 方案二：原生导航栏 -->
<div>
  <div class="label">▼ 方案二 · 原生导航栏</div>
  <div class="phone scheme2">
    <div class="status-bar" style="background:#2D2D3A; color:#F5F0E8;">
      <span class="time">9:41</span>
      <span class="icons">📶 🔋</span>
    </div>
    <div class="native-nav">
      <span class="back">←</span>
      <span class="title">预约信息</span>
    </div>
    <div class="content-wrap">
      <div class="card">
        <div class="venue-header">
          <div class="icon">❤️</div>
          <div class="name">听澜轩</div>
          <div class="divider"></div>
        </div>
        <div class="title-banner">张先生 · 预定信息</div>
        <div class="detail-list">
          <div class="detail-item"><span class="label">📅 日期</span><span class="value">2026-05-07</span></div>
          <div class="detail-item"><span class="label">🕐 时段</span><span class="value">18:00-21:00</span></div>
          <div class="detail-item"><span class="label">🚪 包厢</span><span class="value">晚市包场</span></div>
          <div class="detail-item"><span class="label">👥 人数</span><span class="value">8人</span></div>
        </div>
      </div>
      <div class="address-card">
        <span class="pin">📍</span>
        <div class="info">
          <div class="label2">食堂地址</div>
          <div class="addr">杭州市西湖区...</div>
        </div>
        <span class="action">导航</span>
      </div>
      <div class="footer"><div class="line"></div>本信息由 听澜轩 提供</div>
    </div>
  </div>
</div>

</body>
</html>
